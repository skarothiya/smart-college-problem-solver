<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart College Problem Solver</title>
    <meta name="description" content="Administrator Command Center Login portal.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md), var(--shadow-glow);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 2;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .auth-badge-header {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.35rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .auth-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.925rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .error-alert {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <span>Smart<span class="gradient-text">Campus Admin</span></span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="problems.html" class="nav-link">Browse Problems</a></li>
                <li><a href="admin-login.html" class="nav-link active">Admin Sign In</a></li>
            </ul>

            <div class="nav-actions">
                <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Auth Area -->
    <main class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <span class="auth-badge-header">⚙️ Admin Control Center</span>
                <h1>Admin Sign In</h1>
                <p>Access administration controls & manage campus problem lifecycle</p>
            </div>

            <div class="error-alert" id="authErrorAlert"></div>

            <form id="adminLoginForm" onsubmit="handleAdminLoginSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="adminEmail">Email</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="admin@college.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border: none;">
                    Login
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top:0;">
        <div class="container">
            <div class="footer-bottom" style="border-top:none; padding-top:0;">
                <p>&copy; 2026 Smart College Problem Solver. Admin Login.</p>
                <a href="index.html" style="color: var(--primary);">← Back to Home</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/api/env.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await AuthManager.refreshSession();
            const admin = AuthManager.getAdminSession();
            if (admin && admin.role === 'admin') {
                window.location.href = 'admin.html';
            }
        });

        async function handleAdminLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errorAlert = document.getElementById('authErrorAlert');

            errorAlert.style.display = 'none';

            const result = await AuthManager.adminLogin(email, password);

            if (result.success) {
                if (window.showToast) window.showToast(`Welcome, ${result.session.name}!`, 'success');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 400);
            } else {
                errorAlert.textContent = result.message;
                errorAlert.style.display = 'block';
            }
        }
    </script>
</body>
</html>
