<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart College Problem Solver</title>
    <meta name="description" content="Sign in to your Student or Admin portal on Smart College Problem Solver.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md), var(--shadow-glow);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 2;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .portal-links {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <span>Smart<span class="gradient-text">Campus</span></span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="problems.html" class="nav-link">Browse Problems</a></li>
                <li><a href="report.html" class="nav-link">Report Problem</a></li>
                <li><a href="login.html" class="nav-link active">Login</a></li>
            </ul>

            <div class="nav-actions">
                <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Auth Area -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Choose your portal to sign in or create a student account</p>
            </div>

            <div class="portal-links">
                <a href="student-login.html" class="btn btn-primary btn-lg">🎓 Student Login</a>
                <a href="student-register.html" class="btn btn-secondary btn-lg">Create Student Account</a>
                <a href="admin-login.html" class="btn btn-outline btn-lg">⚙️ Admin Login</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top:0;">
        <div class="container">
            <div class="footer-bottom" style="border-top:none; padding-top:0;">
                <p>&copy; 2026 Smart College Problem Solver.</p>
                <a href="index.html" style="color: var(--primary);">← Back to Landing Page</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/api/env.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await AuthManager.refreshSession();
            const admin = AuthManager.getAdminSession();
            const student = AuthManager.getStudentSession();
            if (admin && admin.role === 'admin') {
                window.location.href = 'admin.html';
            } else if (student && student.role === 'student') {
                window.location.href = 'student-dashboard.html';
            }
        });
    </script>
</body>
</html>
