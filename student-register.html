<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Smart College Problem Solver</title>
    <meta name="description" content="Create your student account on Smart College Problem Solver.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-container {
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem 1.5rem;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-md), var(--shadow-glow);
            backdrop-filter: blur(20px);
            position: relative;
            z-index: 2;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .auth-badge-header {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 0.35rem 1rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .auth-header h1 {
            font-size: 1.85rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.925rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .error-alert {
            display: none;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }

        .success-alert {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6ee7b7;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="nav-brand">
                <div class="brand-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                </div>
                <span>Smart<span class="gradient-text">Campus</span></span>
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="problems.html" class="nav-link">Browse Problems</a></li>
                <li><a href="student-register.html" class="nav-link active">Register</a></li>
                <li><a href="student-login.html" class="nav-link">Student Sign In</a></li>
            </ul>

            <div class="nav-actions">
                <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Auth Area -->
    <main class="auth-container">
        <div class="auth-card">

            <div class="auth-header">
                <span class="auth-badge-header">🎓 Student Portal</span>
                <h1>Create Student Account</h1>
                <p>Register with your own email to report and track campus issues</p>
            </div>

            <div class="error-alert" id="authErrorAlert"></div>
            <div class="success-alert" id="authSuccessAlert"></div>

            <form id="studentRegisterForm" onsubmit="handleStudentRegisterSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="registerName">Full Name</label>
                    <input type="text" id="registerName" class="form-input" placeholder="e.g. Sahil Kumar" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" class="form-input" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" class="form-input" placeholder="Minimum 6 characters" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="registerConfirmPassword">Confirm Password</label>
                    <input type="password" id="registerConfirmPassword" class="form-input" placeholder="Re-enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 0.5rem;">
                    Create Account
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
                Already have an account? <a href="student-login.html" style="color: var(--primary); font-weight: 600;">Sign In →</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer" style="margin-top:0;">
        <div class="container">
            <div class="footer-bottom" style="border-top:none; padding-top:0;">
                <p>&copy; 2026 Smart College Problem Solver. Student Registration.</p>
                <a href="index.html" style="color: var(--primary);">← Back to Home</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-env.js"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await AuthManager.refreshSession();
            const student = AuthManager.getStudentSession();
            if (student && student.role === 'student') {
                window.location.href = 'student-dashboard.html';
            }
        });

        async function handleStudentRegisterSubmit(e) {
            e.preventDefault();

            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const errorAlert = document.getElementById('authErrorAlert');
            const successAlert = document.getElementById('authSuccessAlert');

            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const result = await AuthManager.registerStudent(name, email, password, confirmPassword);

            if (result.success) {
                if (window.showToast) window.showToast('Account created successfully!', 'success');
                successAlert.textContent = result.needsEmailConfirmation
                    ? 'Registration successful! Please check your email to confirm, then sign in.'
                    : 'Registration successful! Redirecting to login...';
                successAlert.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'student-login.html';
                }, result.needsEmailConfirmation ? 2000 : 800);
            } else {
                errorAlert.textContent = result.message;
                errorAlert.style.display = 'block';
            }
        }
    </script>
</body>
</html>
